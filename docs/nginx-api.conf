# Bloque para agregar DENTRO del server { } de /etc/nginx/sites-available/forja,
# antes de "location / {".
#
# Todo lo que empiece con /api/ se reenvía a la API de Node (puerto 3000 local).
# El resto de rutas sigue yendo a la aplicación Laravel, sin cambios.
# "^~" hace que esta regla tenga prioridad sobre las de PHP.

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
